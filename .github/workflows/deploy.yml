# Publishes the game to GitHub Pages every time you push to main.
# The site only updates if the type check and every test pass, so a broken build never goes live.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push waits for the current one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # TypeScript 7 is a native program with a separate package for each operating system.
      # If package-lock.json (made on Windows) lacks the Linux one, install it here.
      - name: Check that TypeScript runs
        run: |
          if ! node node_modules/typescript/bin/tsc --version; then
            npm install --no-save "@typescript/typescript-linux-x64@$(node -p "require('typescript/package.json').version")"
            node node_modules/typescript/bin/tsc --version
          fi

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build the game
        run: npm run build:web

      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
